name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install --upgrade pip uv
      - name: Install package + test deps
        run: |
          uv pip install --system -e .
          uv pip install --system ruff pytest
      - name: Lint (ruff)
        run: ruff check qwenvoice tests
      - name: Test (pytest)
        run: pytest -q
